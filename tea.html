<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточка чая — Teapedia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Noto+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tea-page { padding: 40px 0 80px; }
        .tea-breadcrumb {
            font-size: 14px;
            color: var(--color-text-light);
            margin-bottom: 24px;
        }
        .tea-breadcrumb a { color: var(--color-accent); text-decoration: none; }
        .tea-breadcrumb a:hover { text-decoration: underline; }
        .tea-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
            margin-bottom: 48px;
        }
        .tea-visual {
            background: var(--color-bg-warm);
            border-radius: var(--radius);
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed var(--color-border);
            flex-direction: column;
            gap: 12px;
        }
        .tea-visual span { font-size: 80px; }
        .tea-visual p { color: var(--color-text-light); font-size: 14px; }
        .tea-header h1 {
            font-family: var(--font-serif);
            font-size: 36px;
            margin-bottom: 4px;
        }
        .tea-header .name-cn {
            font-size: 20px;
            color: var(--color-text-light);
            margin-bottom: 16px;
            display: block;
        }
        .tea-header .badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        .tea-price-big {
            font-size: 28px;
            font-weight: 700;
            color: var(--color-accent);
            margin-bottom: 20px;
        }
        .tea-meta-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }
        .meta-item {
            padding: 12px 16px;
            background: var(--color-bg-warm);
            border-radius: var(--radius-sm);
        }
        .meta-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--color-text-light);
            margin-bottom: 4px;
        }
        .meta-value {
            font-size: 14px;
            font-weight: 600;
            color: var(--color-text);
        }
        .tea-description {
            font-size: 16px;
            line-height: 1.8;
            color: var(--color-text);
            margin-bottom: 32px;
        }
        .brewing-section {
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 32px;
            margin-bottom: 32px;
        }
        .brewing-section h2 {
            font-family: var(--font-serif);
            font-size: 22px;
            margin-bottom: 20px;
        }
        .brewing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
        }
        .brew-item {
            text-align: center;
            padding: 16px;
            background: var(--color-bg-warm);
            border-radius: var(--radius-sm);
        }
        .brew-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }
        .brew-label {
            font-size: 12px;
            color: var(--color-text-light);
            margin-bottom: 4px;
        }
        .brew-value {
            font-size: 15px;
            font-weight: 700;
            color: var(--color-text);
        }
        .info-section {
            margin-bottom: 32px;
        }
        .info-section h2 {
            font-family: var(--font-serif);
            font-size: 22px;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--color-border);
        }
        .info-section p {
            font-size: 16px;
            line-height: 1.8;
            color: var(--color-text-light);
        }
        .qr-box {
            background: linear-gradient(135deg, var(--color-bg-warm), #F0EBE3);
            border-radius: var(--radius);
            padding: 32px;
            text-align: center;
            border: 1px solid var(--color-border);
        }
        .qr-box h3 {
            font-family: var(--font-serif);
            font-size: 20px;
            margin-bottom: 8px;
        }
        .qr-box p {
            font-size: 14px;
            color: var(--color-text-light);
            margin-bottom: 16px;
        }
        .qr-code {
            width: 160px;
            height: 160px;
            background: var(--color-text);
            border-radius: 8px;
            margin: 0 auto;
            position: relative;
        }
        .qr-code::before {
            content: '';
            position: absolute;
            inset: 10px;
            border: 3px solid var(--color-card);
            border-radius: 4px;
        }
        .qr-code::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 45px;
            height: 45px;
            background: var(--color-card);
            border-radius: 4px;
        }
        .qr-url {
            margin-top: 12px;
            font-size: 13px;
            color: var(--color-accent);
            font-weight: 600;
        }
        .not-found {
            text-align: center;
            padding: 80px 20px;
        }
        .not-found h1 {
            font-family: var(--font-serif);
            font-size: 32px;
            margin-bottom: 16px;
        }
        @media (max-width: 900px) {
            .tea-detail-grid { grid-template-columns: 1fr; }
            .tea-visual { min-height: 280px; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <span class="logo-icon">🍵</span>
                <div class="logo-text">
                    <span class="logo-main">Teapedia</span>
                    <span class="logo-sub">Энциклопедия китайского чая</span>
                </div>
            </a>
            <nav class="main-nav">
                <a href="index.html" class="nav-link">Каталог</a>
                <a href="encyclopedia/index.html" class="nav-link">Энциклопедия</a>
                <a href="index.html#about" class="nav-link">О проекте</a>
            </nav>
            <button class="menu-toggle" aria-label="Меню">☰</button>
        </div>
    </header>

    <main class="tea-page">
        <div class="container" id="teaContainer">
            <!-- Контент загружается JS -->
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <div class="footer-brand">
                <span class="logo-main">Teapedia</span>
                <span>Энциклопедия китайского чая</span>
            </div>
            <div class="footer-links">
                <a href="index.html">Каталог</a>
                <a href="encyclopedia/index.html">Энциклопедия</a>
                <a href="https://vk.ru/the_chai_spb" target="_blank">VK</a>
            </div>
            <div class="footer-copy">© 2026 Teapedia × THE CHAI</div>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await loadTeas();
            const teaId = getUrlParam('id');
            const tea = allTeas.find(t => t.id === teaId);
            const container = document.getElementById('teaContainer');

            if (!tea) {
                container.innerHTML = `
                    <div class="not-found">
                        <h1>🍵 Чай не найден</h1>
                        <p style="color:var(--color-text-light);margin-bottom:24px;">Возможно, он ещё не добавлен в энциклопедию.</p>
                        <a href="index.html" class="btn btn-primary">В каталог</a>
                    </div>
                `;
                return;
            }

            document.title = `${tea.name} — Teapedia`;

            const badgeColors = {
                green: { bg: '#E8F5E9', text: '#2E7D32' },
                white: { bg: '#F5F5F5', text: '#616161' },
                oolong: { bg: '#FFF3E0', text: '#E65100' },
                red: { bg: '#FFEBEE', text: '#C62828' },
                dark: { bg: '#3E2723', text: '#D7CCC8' },
                yellow: { bg: '#FFFDE7', text: '#F9A825' }
            };
            const bc = badgeColors[tea.category] || { bg: '#F5F0E8', text: '#2C2416' };

            container.innerHTML = `
                <div class="tea-breadcrumb">
                    <a href="index.html">← Каталог</a> / <span>${tea.name}</span>
                </div>

                <div class="tea-detail-grid">
                    <div class="tea-visual" style="background:${bc.bg};">
                        <span>🍃</span>
                        <p>Загрузите фото чая</p>
                    </div>
                    <div class="tea-header">
                        <h1>${tea.name}</h1>
                        <span class="name-cn">${tea.nameCn}</span>
                        <span class="badge" style="background:${bc.bg};color:${bc.text};">${tea.categoryName}</span>
                        <div class="tea-price-big">${tea.price}</div>
                        <div class="tea-meta-grid">
                            <div class="meta-item">
                                <div class="meta-label">Регион</div>
                                <div class="meta-value">${tea.origin}</div>
                            </div>
                            <div class="meta-item">
                                <div class="meta-label">Высота</div>
                                <div class="meta-value">${tea.altitude}</div>
                            </div>
                            <div class="meta-item">
                                <div class="meta-label">Окисление</div>
                                <div class="meta-value">${tea.oxidation}</div>
                            </div>
                            <div class="meta-item">
                                <div class="meta-label">Сбор</div>
                                <div class="meta-value">${tea.harvest}</div>
                            </div>
                        </div>
                        <p class="tea-description">${tea.description}</p>
                    </div>
                </div>

                <div class="brewing-section">
                    <h2>☕ Рецепт заваривания</h2>
                    <div class="brewing-grid">
                        <div class="brew-item">
                            <div class="brew-icon">🌡️</div>
                            <div class="brew-label">Температура</div>
                            <div class="brew-value">${tea.brewing.temp}</div>
                        </div>
                        <div class="brew-item">
                            <div class="brew-icon">⚖️</div>
                            <div class="brew-label">Дозировка</div>
                            <div class="brew-value">${tea.brewing.amount}</div>
                        </div>
                        <div class="brew-item">
                            <div class="brew-icon">⏱️</div>
                            <div class="brew-label">Время</div>
                            <div class="brew-value">${tea.brewing.time}</div>
                        </div>
                        <div class="brew-item">
                            <div class="brew-icon">🫖</div>
                            <div class="brew-label">Посуда</div>
                            <div class="brew-value">${tea.brewing.vessel}</div>
                        </div>
                        <div class="brew-item">
                            <div class="brew-icon">🔁</div>
                            <div class="brew-label">Заварок</div>
                            <div class="brew-value">${tea.brewing.infusions}</div>
                        </div>
                    </div>
                </div>

                <div class="info-section">
                    <h2>📜 История</h2>
                    <p>${tea.history}</p>
                </div>

                <div class="info-section">
                    <h2>💚 Польза</h2>
                    <p>${tea.health}</p>
                </div>

                <div class="info-section">
                    <h2>👅 Вкусовой профиль</h2>
                    <p>${tea.flavor}</p>
                </div>

                <div class="qr-box">
                    <h3>📱 QR-код для упаковки</h3>
                    <p>Отсканируйте, чтобы открыть эту страницу на телефоне</p>
                    <div class="qr-code"></div>
                    <div class="qr-url">${tea.qrUrl}</div>
                </div>
            `;
        });
    </script>
</body>
</html>
