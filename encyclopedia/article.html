<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Статья — Teapedia</title><link rel="stylesheet" href="../admin/admin.css"></head><body><header class="topbar"><a href="index.html">Teapedia</a><span>Энциклопедия</span></header><main class="workspace"><article id="article" class="preview"><p>Загрузка…</p></article></main><script>
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const id=new URLSearchParams(location.search).get('id');
fetch('../data/generated/articles-public.json').then(r=>r.json()).then(data=>{const a=data.articles.find(x=>x.id===id);if(!a)throw Error();document.title=a.title_ru+' — Teapedia';document.querySelector('#article').innerHTML=`<h1>${esc(a.title_ru)}</h1><p class="subtitle">${esc(a.subtitle_ru)}</p><p class="summary">${esc(a.summary_ru)}</p>${a.sections.map(s=>`<section><h3>${esc(s.heading_ru)}</h3>${s.paragraphs_ru.map(p=>`<p>${esc(p)}</p>`).join('')}</section>`).join('')}<div class="source"><b>Источник:</b> <a href="${esc(a.source.revision_url)}">${esc(a.source.title)}</a> · <a href="${esc(a.source.license_url)}">${esc(a.source.license)}</a><br>${esc(a.source.adaptation_notice_ru)}</div>`}).catch(()=>document.querySelector('#article').innerHTML='<h1>Статья не найдена</h1><p>Материал ещё не опубликован или не существует.</p>');
</script></body></html>
