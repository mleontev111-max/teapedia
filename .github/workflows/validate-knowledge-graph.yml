name: Validate Teapedia

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile scripts/validate_graph.py scripts/build_graph_index.py scripts/build_articles.py scripts/build_public_site.py scripts/verify_public_artifact.py scripts/import_teapedia.py

      - name: Validate entity schema and relations
        run: python scripts/validate_graph.py

      - name: Build reverse graph index
        run: python scripts/build_graph_index.py

      - name: Validate and build editorial articles
        run: python scripts/build_articles.py

      - name: Build and verify public deploy artifact
        run: |
          python scripts/build_public_site.py
          python scripts/verify_public_artifact.py build/public

      - name: Validate legacy JSON
        run: |
          python -m json.tool data/teas.json >/dev/null
          python -m json.tool data/ware.json >/dev/null

      - name: Static HTTP smoke
        run: |
          cd build/public
          python -m http.server 8000 >/tmp/teapedia-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:8000/index.html >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/index.html >/dev/null
          curl --fail --silent http://127.0.0.1:8000/tea.html >/dev/null
          curl --fail --silent http://127.0.0.1:8000/encyclopedia/index.html >/dev/null
          curl --fail --silent http://127.0.0.1:8000/data/teas.json >/dev/null
          curl --fail --silent http://127.0.0.1:8000/data/ware.json >/dev/null
          curl --fail --silent http://127.0.0.1:8000/data/generated/articles-public.json >/dev/null
          for private_path in admin/index.html data/generated/articles-admin.json content/articles/bai-hao-yin-zhen.json content/media/bai-hao-yin-zhen-source-image.json ingestion/teapedia.org/imports/bai-hao-yin-zhen/source.json; do
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:8000/$private_path")" = 404
          done

      - name: Ensure generated editorial artifacts are current
        run: git diff --exit-code -- data/generated/articles-admin.json data/generated/articles-public.json

      - name: Show generated graph summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/generated/graph-index.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          print('entity_count:', data['entity_count'])
          print('incoming_nodes:', len(data['incoming']))
          PY

      - name: Upload generated graph index
        uses: actions/upload-artifact@v4
        with:
          name: teapedia-graph-index
          path: data/generated/graph-index.json
